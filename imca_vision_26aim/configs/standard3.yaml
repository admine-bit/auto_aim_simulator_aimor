R_camera2gimbal: [-0.016674557024822633, -0.0088890170728965056, 0.99982145632282948, 0.99953499340541119, 0.025383862529954448, 0.016895457410342644, -0.025529514411172627, 0.9996382570202772, 0.0084616189580721986]
t_camera2gimbal: [0.15410180318944805, 0.051175419633965234, -0.057805924631733709]


# 12. 自瞄决策模式（不影响打符）
#####-----decider参数-----#####
mode: 1
