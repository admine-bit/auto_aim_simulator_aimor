# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
yolov5_engine_path: model/yolov5_orin_fp16.engine
yolov8_engine_path: assets/yolov8.engine
yolo11_engine_path: assets/yolo11.engine
classify_engine_path: model/tiny_resnet.engine
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 500
  y: 400
  width: 500
  height: 500

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 1.5 # degree
pitch_offset: -0.5 # degree
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.050 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 100 # 近距离射击容差，degree
second_tolerance: 100 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 5.0
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# 重投影误差: 0.1488px
camera_matrix: [1775.1300101814929, 0, 710.22041588791421, 0, 1777.9427175568535, 599.38373307949621, 0, 0, 1]
distort_coeffs: [-0.081907189655237952, 0.14019999270205855, -0.0012264127665053185, 0.0014292255962000792, 0]

# 相机同理想情况的偏角: yaw1.81 pitch0.16 roll-0.00 degree
R_camera2gimbal: [-0.03152275773856239, 0.0027095830669845509, 0.99949936163269204, -0.99950303430107212, -9.8404785402239625e-05, -0.031522606799691932, 1.2942398579498703e-05, -0.99999632423129503, 0.0027113384873522772]
t_camera2gimbal: [0.13895789074180098, 0.066620637390426771, 0.028079650211170731]


#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"
yolo11_buff_engine_path: model/yolo11_buff.engine
buff_yolo_confidence_threshold: 0.50  # YOLO Buff 目标框置信度阈值
buff_yolo_keypoint_threshold: 0.50    # kpt0~3、kpt5 关键点置信度阈值
buff_yolo_nms_iou_threshold: 0.40     # 相同目标候选框 NMS IoU 阈值
buff_loss_max_frames: 20               # 整帧无有效目标时，保留历史目标的最大帧数
buff_secondary_hold_max_frames: 20     # 副目标漏检时，继续使用推断副槽的最大帧数

# 大符双目标自动切换：true=第一发后自动切副目标；false=关闭自动切换（仅影响 Aimer）
buff_auto_secondary_switch: true

#####-----buff pose/filter 参数（键缺失时代码使用同名默认值）-----#####
buff_pnp_max_rmse_px: 4.0            # 五点 PnP 最大重投影 RMSE，超限且 kpt5 异常时回退四角
buff_max_plane_pitch_deg: 20.0       # 镜像消歧：符竖直⇒真解符面 pitch≈0，候选超此值不采信
buff_pitch_separation_deg: 8.0       # 两支候选 pitch 至少拉开这么多，pitch 先验才生效
buff_r_measurement_std_m: 0.05       # PnP R 中心测量标准差
buff_r_process_std_m_sqrt_s: 0.15    # R 随机游走强度（移动平台）
buff_r_innovation_gate_m: 0.30       # 7m 处的 R 创新门限，实际按距离缩放
buff_r_relocate_min_streak: 3        # 重定位要求连续一致的大创新帧数
buff_r_relocate_min_updates: 30      # 收敛前禁用重定位，防止坏初始化被锁死
buff_phase_innovation_gate_deg: 25.0 # 相位创新门限，必须小于半槽 36°
buff_unwrap_max_dt_s: 0.6            # 解卷绕可信的最大观测间隔，超过则清空拟合历史
buff_fit_window_s: 4.0               # 大符正弦拟合窗口（周期 3.14~3.33s）
buff_fit_min_span_s: 1.5             # 样本跨度不足时不开拟
buff_dual_roll_tolerance_deg: 12.0   # 同帧主副 roll 差偏离 72° 整数倍超此值则丢弃副片观测
buff_full_reset_s: 3.0               # 连续完全丢失超过该时间才整体重置共享滤波器（规则换组黑屏≤0.2s）

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520   # s
predict_time: 0.100     # s
buff_yaw_offset: 0.0
buff_pitch_offset: 0.0
buff_fire_dis: 0.08
barrel_delay: 0.1
rune_idle_duration: 0.4  # RMCS 风格能量机关空闲窗口（s）
rune_shoot_duration: 0.2  # RMCS 风格能量机关开火窗口（s）
buff_use_rmcs_fire_cycle: true  # 使用 idle/shoot 周期替代固定 fire_gap_time
